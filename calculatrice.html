<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101a2c">
<meta name="description" content="Calculatrice interactive créée par Faïçal Yaya Al-Hassan avec HTML, CSS et JavaScript.">
<meta name="description" content="Calculatrice interactive réalisée en HTML, CSS et JavaScript.">
<title>Calculatrice – Portfolio de Faïçal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0a0a0f;
  --bg-card: #12121a;
  --bg-display: #0d0d14;
  --color-cyan: #00e5ff;
  --color-orange: #ff6b35;
  --color-green: #39ff14;
  --color-purple: #9d4edd;
  --color-btn: #1a1a2e;
  --color-btn-hover: #252540;
  --text-primary: #e8e8f0;
  --text-dim: #6060a0;
}
* {margin:0;padding:0;box-sizing:border-box;}
body {background:radial-gradient(ellipse at 50% 0%,#1d2d51,var(--bg-dark) 65%);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;min-height:100vh;padding:24px;font-family:'Exo 2',sans-serif;color:var(--text-primary)}
.back-link{align-self:center;color:#a8c3df;text-decoration:none;font-size:.9rem;font-weight:600}.back-link:hover{color:var(--color-cyan)}
.calculator {
  width:min(100%,360px);
  background:linear-gradient(145deg,#171725,#101019);
  border:1px solid #292941;
  border-radius:24px;
  padding:24px;
  box-shadow:0 25px 80px #0008, inset 0 1px #ffffff0b;
}
.display {
  background:var(--bg-display);
  border-radius:12px;
  padding:16px;
  margin-bottom:20px;
  text-align:right;
}
.display-expression {
  font-size:12px;
  color:var(--text-dim);
}
.display-value {
  font-size:40px;
  color:var(--color-cyan);
}
.buttons-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.btn {height:56px;border:1px solid #ffffff08;border-radius:12px;background:var(--color-btn);color:var(--text-primary);cursor:pointer;font:600 1.05rem 'Exo 2',sans-serif;transition:transform .15s,background .15s;}
.btn:hover{background:var(--color-btn-hover);transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn:focus-visible{outline:3px solid var(--color-cyan);outline-offset:3px}.btn-operator{background:#292033}.btn-equals{background:#12343b}.calculator-subtitle{margin-top:-10px;margin-bottom:17px;color:#8989ad;font-size:.85rem}
.btn-operator {color:var(--color-orange);}
.btn-equals {color:var(--color-cyan);}
</style>
</head>

<body>
<a class="back-link" href="projets.html">← Retour aux projets</a>
<main class="calculator" aria-label="Calculatrice interactive">
  <h1 style="color:var(--text-primary);font-size:1.35rem;margin-bottom:16px;">Calculatrice <span aria-hidden="true" style="color:var(--color-cyan)">.</span></h1>
  <p class="calculator-subtitle">Une application web réalisée par Faïçal</p>
  <div class="display" aria-live="polite">
    <div id="expression" class="display-expression"></div>
    <div id="result" class="display-value">0</div>
  </div>

  <div class="buttons-grid">
    <button class="btn" aria-label="7" onclick="ajouterChiffre('7')">7</button>
    <button class="btn" onclick="ajouterChiffre('8')">8</button>
    <button class="btn" onclick="ajouterChiffre('9')">9</button>
    <button class="btn btn-operator" onclick="choisirOperation('÷')">÷</button>

    <button class="btn" onclick="ajouterChiffre('4')">4</button>
    <button class="btn" onclick="ajouterChiffre('5')">5</button>
    <button class="btn" onclick="ajouterChiffre('6')">6</button>
    <button class="btn btn-operator" onclick="choisirOperation('×')">×</button>

    <button class="btn" onclick="ajouterChiffre('1')">1</button>
    <button class="btn" onclick="ajouterChiffre('2')">2</button>
    <button class="btn" onclick="ajouterChiffre('3')">3</button>
    <button class="btn btn-operator" onclick="choisirOperation('−')">−</button>

    <button class="btn" onclick="ajouterChiffre('0')">0</button>
    <button class="btn" onclick="ajouterVirgule()">.</button>
    <button class="btn btn-equals" onclick="calculerResultat()">=</button>
    <button class="btn btn-operator" onclick="choisirOperation('+')">+</button>

    <button class="btn" onclick="toutEffacer()">C</button>
  </div>
</main>
<p style="color:#73738f;font-size:.78rem;text-align:center">HTML · CSS · JavaScript</p>

<script>
let nombreActuel='0';
let nombrePrecedent='';
let operation=null;
let nouvelleEntree=false;

const affichageResultat=document.getElementById('result');
const affichageExpression=document.getElementById('expression');

function mettreAJourAffichage(){
  affichageResultat.textContent=nombreActuel;
  affichageExpression.textContent=nombrePrecedent+' '+(operation||'');
}

function ajouterChiffre(chiffre){
  if(nombreActuel==='Erreur'){
    nombreActuel='0';
  }
  if(nouvelleEntree){
    nombreActuel=chiffre;
    nouvelleEntree=false;
  }else{
    nombreActuel=(nombreActuel==='0')?chiffre:nombreActuel+chiffre;
  }
  mettreAJourAffichage();
}

function ajouterVirgule(){
  if(nouvelleEntree){
    nombreActuel='0';
    nouvelleEntree=false;
  }
  if(!nombreActuel.includes('.')){
    nombreActuel+='.';
  }
  mettreAJourAffichage();
}

function choisirOperation(op){
  if(operation && !nouvelleEntree){
    calculerResultat();
  }
  nombrePrecedent=nombreActuel;
  operation=op;
  nouvelleEntree=true;
  mettreAJourAffichage();
}

function calculerResultat(){
  const a=parseFloat(nombrePrecedent);
  const b=parseFloat(nombreActuel);
  let resultat;

  switch(operation){
    case '+': resultat=a+b; break;
    case '−': resultat=a-b; break;
    case '×': resultat=a*b; break;
    case '÷': resultat=b!==0?a/b:'Erreur'; break;
    default: return;
  }

  if (resultat === 'Erreur' || !Number.isFinite(resultat)) {
    nombreActuel='Erreur';
    nombrePrecedent='';
    operation=null;
    nouvelleEntree=true;
    mettreAJourAffichage();
    return;
  }
  nombreActuel=String(Number(resultat.toPrecision(10)));
  nombrePrecedent='';
  operation=null;
  nouvelleEntree=true;
  mettreAJourAffichage();
}

function toutEffacer(){
  nombreActuel='0';
  nombrePrecedent='';
  operation=null;
  mettreAJourAffichage();
}
</script>
</body>
</html>
